<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 我的备忘录</title>
<style>
:root{
  --primary:#4f46e5;
  --primary2:#7c3aed;
  --accent:#06b6d4;
  --danger:#ef4444;
  --ink:#0f172a;
  --ink2:#475569;
  --ink3:#94a3b8;
  --line:#e2e8f0;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:#eef2ff;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
/* ── 背景装饰 ── */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;
  background:linear-gradient(140deg,#eef2ff 0%,#faf5ff 40%,#ecfeff 100%);}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;}
.b1{width:520px;height:520px;background:radial-gradient(circle,#6366f1,transparent 70%);top:-160px;left:-120px;animation:drift 14s ease-in-out infinite;}
.b2{width:420px;height:420px;background:radial-gradient(circle,#a855f7,transparent 70%);bottom:-140px;right:-100px;animation:drift 11s ease-in-out infinite reverse;}
.b3{width:300px;height:300px;background:radial-gradient(circle,#22d3ee,transparent 70%);top:40%;left:55%;animation:drift 18s ease-in-out infinite .8s;}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(40px,-30px) scale(1.08);}
  66%{transform:translate(-30px,25px) scale(.94);}
}
/* 网格纹理 */
.bg::after{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(99,102,241,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(99,102,241,.05) 1px,transparent 1px);
  background-size:44px 44px;}

/* ── 卡片 ── */
.card{
  position:relative;z-index:1;
  width:min(920px,92vw);
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.7);
  border-radius:26px;
  box-shadow:0 18px 60px rgba(79,70,229,.18),0 2px 8px rgba(15,23,42,.06);
  display:grid;grid-template-columns:1fr 1fr;
  overflow:hidden;
  animation:rise .7s cubic-bezier(.16,1,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.97);}to{opacity:1;transform:none;}}

/* 左侧品牌区 */
.brand{
  padding:46px 40px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#4f46e5 0%,#7c3aed 55%,#06b6d4 130%);
  display:flex;flex-direction:column;justify-content:space-between;
}
.brand::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;
  background:rgba(255,255,255,.13);top:-90px;right:-90px;animation:pulseSoft 6s ease-in-out infinite;}
.brand::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.09);bottom:-70px;left:-50px;animation:pulseSoft 8s ease-in-out infinite reverse;}
@keyframes pulseSoft{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
.brand>*{position:relative;z-index:1;}
.logo{display:flex;align-items:center;gap:10px;font-size:1.05em;font-weight:700;letter-spacing:.01em;}
.logo-dot{width:11px;height:11px;border-radius:50%;background:#fff;animation:blink 1.8s ease-in-out infinite;}
@keyframes blink{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.7);opacity:.45;}}
.brand h1{font-size:2.05em;font-weight:800;line-height:1.25;margin:22px 0 12px;letter-spacing:-.01em;}
.brand p{font-size:.92em;line-height:1.75;opacity:.9;}
.feats{margin-top:26px;display:flex;flex-direction:column;gap:12px;}
.feat{display:flex;align-items:center;gap:10px;font-size:.86em;
  background:rgba(255,255,255,.14);padding:9px 14px;border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  animation:slideIn .6s cubic-bezier(.16,1,.3,1) both;}
.feat:nth-child(1){animation-delay:.25s;}
.feat:nth-child(2){animation-delay:.4s;}
.feat:nth-child(3){animation-delay:.55s;}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px);}to{opacity:1;transform:none;}}
.feat .ic{font-size:1.1em;}

/* 右侧表单区 */
.form-side{padding:40px 42px;display:flex;flex-direction:column;justify-content:center;}
/* 标题与首次设置提示 */
.pane-title{font-size:1.05em;font-weight:800;color:var(--ink);margin:0 0 20px;letter-spacing:.02em;}
.setup-note{background:#eef2ff;border:1px solid #c7d2fe;color:#4338ca;border-radius:10px;
  padding:12px 14px;font-size:.8em;line-height:1.75;margin-bottom:20px;}
.setup-note b{color:#4f46e5;}

.pane{display:none;animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both;}
.pane.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

.field{margin-bottom:16px;position:relative;}
.field label{display:block;font-size:.78em;font-weight:600;color:var(--ink2);margin-bottom:7px;}
.inp-wrap{position:relative;}
.inp-wrap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.95em;opacity:.55;pointer-events:none;}
.field input{
  width:100%;padding:12px 14px 12px 38px;
  border:1.5px solid var(--line);border-radius:12px;
  font-size:.9em;color:var(--ink);background:#fff;
  transition:.25s cubic-bezier(.4,0,.2,1);outline:none;
}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,.12);}
.field input::placeholder{color:#b9c2d0;}

.btn{
  width:100%;padding:13px;border:none;border-radius:12px;cursor:pointer;
  font-size:.95em;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 6px 20px rgba(79,70,229,.32);
  transition:.25s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(79,70,229,.42);}
.btn:active{transform:translateY(0) scale(.985);}
.btn[disabled]{opacity:.7;cursor:not-allowed;transform:none;}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.tip{font-size:.76em;color:var(--ink3);text-align:center;margin-top:16px;line-height:1.7;}
.tip a{color:var(--primary);text-decoration:none;font-weight:600;cursor:pointer;}
.tip a:hover{text-decoration:underline;}

/* 密码强度条 */
.strength{display:flex;gap:5px;margin-top:8px;}
.strength i{flex:1;height:4px;border-radius:3px;background:#e2e8f0;transition:.3s;}
.strength.s1 i:nth-child(1){background:#ef4444;}
.strength.s2 i:nth-child(-n+2){background:#f59e0b;}
.strength.s3 i:nth-child(-n+3){background:#10b981;}
.strength.s4 i{background:#059669;}
.strength-txt{font-size:.72em;color:var(--ink3);margin-top:6px;min-height:1em;}

.alert{
  margin-bottom:14px;padding:10px 14px;border-radius:10px;font-size:.8em;
  display:none;align-items:center;gap:8px;
  animation:shake .4s cubic-bezier(.36,.07,.19,.97);
}
.alert.show{display:flex;}
.alert.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.alert.ok{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;}
@keyframes shake{10%,90%{transform:translateX(-2px);}30%,70%{transform:translateX(3px);}50%{transform:translateX(-3px);}}

@media(max-width:820px){
  .card{grid-template-columns:1fr;width:min(440px,93vw);}
  .brand{padding:32px 30px;}
  .brand h1{font-size:1.5em;margin:14px 0 8px;}
  .feats{display:none;}
  .form-side{padding:30px 28px;}
  body{align-items:flex-start;padding:46px 0 30px;overflow:auto;}
  html,body{height:auto;min-height:100%;}
}
</style>
</head>
<body>
<div class="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="card">
  <!-- 左：品牌 -->
  <div class="brand">
    <div>
      <div class="logo"><span class="logo-dot"></span>日历备忘录</div>
      <h1>把重要的事<br>交给时间记住</h1>
      <p>云端保存你的每一条日程，多设备随时查看。自动倒计时、紧急度分级、过期事件自动沉底，让安排永远井井有条。</p>
    </div>
    <div class="feats">
      <div class="feat"><span class="ic">☁️</span>数据存本地 SQLite，重启不丢失</div>
      <div class="feat"><span class="ic">⏳</span>实时倒计时，紧急事项自动置顶</div>
      <div class="feat"><span class="ic">🗓️</span>日历打点，一眼看完整月安排</div>
    </div>
  </div>

  <!-- 右：表单 -->
  <div class="form-side">
    <div class="alert" id="alert"></div>

    <!-- 登录 -->
    <div class="pane active" id="pane-login">
      <h2 class="pane-title">登录</h2>
      <div class="field">
        <label>用户名</label>
        <div class="inp-wrap"><span class="icon">👤</span>
          <input type="text" id="loginUser" placeholder="请输入用户名" autocomplete="username"></div>
      </div>
      <div class="field">
        <label>密码</label>
        <div class="inp-wrap"><span class="icon">🔒</span>
          <input type="password" id="loginPwd" placeholder="请输入密码" autocomplete="current-password"></div>
      </div>
      <button class="btn" id="loginBtn">登 录</button>
      <div class="tip">单机版只有一个管理员账号，密码忘记时重装或删除 data/memo.db 即可重置。</div>
    </div>

    <!-- 首次设置密码 -->
    <div class="pane" id="pane-setup">
      <h2 class="pane-title">设置管理员密码</h2>
      <div class="setup-note">
        🔐 首次使用，请为管理员账号 <b id="setupUser">admin</b> 设置一个密码。<br>
        此后只能通过这个密码登录，务必牢记。
      </div>
      <div class="field">
        <label>新密码（至少 8 位，需含字母和数字）</label>
        <div class="inp-wrap"><span class="icon">🔒</span>
          <input type="password" id="setupPwd" placeholder="请设置密码" autocomplete="new-password"></div>
        <div class="strength" id="pwdBar"><i></i><i></i><i></i><i></i></div>
        <div class="strength-txt" id="pwdTxt"></div>
      </div>
      <div class="field">
        <label>确认密码</label>
        <div class="inp-wrap"><span class="icon">🔒</span>
          <input type="password" id="setupPwd2" placeholder="请再次输入密码" autocomplete="new-password"></div>
      </div>
      <button class="btn" id="setupBtn">保 存 并 进 入</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

/* ── 面板切换（只有登录 / 首次设置两个） ── */
function switchPane(name){
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  const pane = $('#pane-'+name);
  if(!pane) return;
  void pane.offsetWidth;            // 重排，保证动画每次都触发
  pane.classList.add('active');
  hideAlert();
}

/* ── 提示条 ── */
function showAlert(msg, type){
  const el = $('#alert');
  el.className = 'alert show ' + (type||'err');
  el.textContent = msg;
}
function hideAlert(){ $('#alert').className = 'alert'; }

/* ── 按钮 loading 态 ── */
function loading(btn, on){
  if(on){
    btn.dataset.txt = btn.innerHTML;
    btn.innerHTML = '<span class="spin"></span>处理中...';
    btn.disabled = true;
  }else{
    btn.innerHTML = btn.dataset.txt || '提交';
    btn.disabled = false;
  }
}

async function post(url, body){
  const res = await fetch(url, {
    method:'POST',
    credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return res.json();
}

/* ── 登录 ── */
async function doLogin(){
  const username = $('#loginUser').value.trim();
  const password = $('#loginPwd').value;
  if(!username || !password){ showAlert('请输入用户名和密码'); return; }
  const btn = $('#loginBtn'); loading(btn, true);
  try{
    const ret = await post('/api/memo/login', {username, password});
    if(ret.code === 0){
      showAlert('登录成功，正在进入...', 'ok');
      setTimeout(()=>location.href='/memo.html', 480);
    }else if(ret.needSetup){
      // 账号还没设密码：直接引导到设置面板，不让用户卡在登录页
      loading(btn, false);
      enterSetup(ret.username || username);
    }else{
      showAlert(ret.msg || '登录失败');
      loading(btn, false);
    }
  }catch(e){
    showAlert('网络异常，请稍后重试'); loading(btn, false);
  }
}

/* ── 密码强度条 ── */
$('#setupPwd').addEventListener('input', e=>{
  const v = e.target.value, bar = $('#pwdBar'), txt = $('#pwdTxt');
  let s = 0;
  if(v.length >= 8) s++;
  if(/[A-Za-z]/.test(v) && /[0-9]/.test(v)) s++;
  if(/[^A-Za-z0-9]/.test(v)) s++;
  if(v.length >= 12) s++;
  bar.className = 'strength' + (v ? ' s'+s : '');
  txt.textContent = !v ? '' : ['太弱，请加长并混合字母数字','较弱','一般，可用','较强','很强'][s];
});

/* ── 首次设置管理员密码 ── */
function enterSetup(username){
  $('#setupUser').textContent = username || 'admin';
  switchPane('setup');
  setTimeout(()=>$('#setupPwd').focus(), 150);
}

async function doSetup(){
  const password = $('#setupPwd').value;
  const pwd2 = $('#setupPwd2').value;
  if(password.length < 8){ showAlert('密码至少 8 位'); return; }
  if(!/[A-Za-z]/.test(password) || !/[0-9]/.test(password)){ showAlert('密码需同时包含字母和数字'); return; }
  if(password !== pwd2){ showAlert('两次输入的密码不一致'); return; }
  const btn = $('#setupBtn'); loading(btn, true);
  try{
    const ret = await post('/api/memo/setup', {password, password2: pwd2});
    if(ret.code === 0){
      showAlert('密码已设置，正在进入...', 'ok');
      setTimeout(()=>location.href='/memo.html', 480);
    }else{
      showAlert(ret.msg || '设置失败'); loading(btn, false);
    }
  }catch(e){
    showAlert('网络异常，请稍后重试'); loading(btn, false);
  }
}

$('#loginBtn').onclick = doLogin;
$('#setupBtn').onclick = doSetup;
['#loginUser','#loginPwd'].forEach(s=>$(s).addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));
['#setupPwd','#setupPwd2'].forEach(s=>$(s).addEventListener('keydown', e=>{ if(e.key==='Enter') doSetup(); }));

/* 启动探测：已登录直接进主页；有待设密码的账号则强制去设置 */
(async function(){
  try{
    const b = await (await fetch('/api/memo/bootstrap', {credentials:'same-origin'})).json();
    if(b.code === 0 && b.data && b.data.needSetup){ enterSetup(b.data.username); return; }
  }catch(e){}
  try{
    const r = await fetch('/api/memo/check', {credentials:'same-origin'});
    const j = await r.json();
    if(j.code === 0 && j.data && j.data.login) location.href = '/memo.html';
  }catch(e){}
})();
</script>
</body>
</html>
